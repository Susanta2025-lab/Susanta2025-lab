      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#818CF8" stop-opacity="0.4"/>
