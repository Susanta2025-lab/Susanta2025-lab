<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-labelledby="liTitle liDesc">
  <title id="liTitle">AI Engineer &#8212; Generative AI, RAG, AI Agents</title>
  <desc id="liDesc">LinkedIn profile banner for an AI Engineer specializing in Generative AI, RAG, AI Agents, AI Solution Architecture, and production-oriented AI systems.</desc>
  <defs>
